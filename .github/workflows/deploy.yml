name: Deploy Award Voting to VPS

on:
  push:
    branches: [ "develop" ]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}         # <-- DOIT exister
          username: ${{ secrets.VPS_USER }}     # <-- DOIT exister
          key: ${{ secrets.SSH_KEY }}       # <-- DOIT exister
          port: ${{ secrets.VPS_PORT }}         # optionnel, sinon par défaut 22
          script_stop: true
          command_timeout: 60m
          script: |
            set -e
            cd ~
            rm -rf award-voting
            git clone -b ${{ github.ref_name }} https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} award-voting
            cd award-voting

            # Debug structure
            ls -la
            ls -la server || true
            ls -la client || true

            # Build (contexte = racine)
            docker build -t award_voting_server:latest -f server/Dockerfile .
            docker build -t award_voting_client:latest -f client/Dockerfile .

            # Stop/remove anciens conteneurs
            docker stop award_voting_server || true
            docker rm   award_voting_server || true
            docker stop award_voting_client || true
            docker rm   award_voting_client || true

            # Réseau Docker
            docker network create award_net || true

            # Backend
            docker run -d \
              --name award_voting_server \
              --network award_net \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -p 8000:8000 \
              --restart=unless-stopped \
              award_voting_server:latest

            # Frontend
            docker run -d \
              --name award_voting_client \
              --network award_net \
              -p 8080:80 \
              --restart=unless-stopped \
              award_voting_client:latest

            docker image prune -f || true
