name: Deploy Award Voting to VPS

on:
  push:
    branches: [ "develop" ]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # décommente si tes secrets sont dans un "Environment" protégé
    # environment: production
    steps:
      - name: Checkout (for logs only)
        uses: actions/checkout@v4

      # ✅ Étape de sanity-check: on s'assure que les secrets existent AVANT l'SSH
      - name: Assert required secrets
        run: |
          if [ -z "${{ secrets.VPS_IP }}" ]; then echo "❌ Missing secret VPS_IP"; exit 1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "❌ Missing secret VPS_USER"; exit 1; fi
          if [ -z "${{ secrets.SSH_KEY }}" ]; then echo "❌ Missing secret SSH_KEY"; exit 1; fi
          echo "✅ Secrets present."

      # 🔍 Debug : vérifie que la clé a une taille cohérente (sans jamais l'afficher)
      - name: Validate SSH key format
        run: |
          KEY_LEN=$(echo '${{ secrets.SSH_KEY }}' | wc -c)
          echo "🔑 SSH_KEY length: $KEY_LEN chars"
          if [ "$KEY_LEN" -lt 100 ]; then
            echo "❌ SSH_KEY seems too short ($KEY_LEN chars). Did you paste the full private key?"
            exit 1
          fi
          if ! echo '${{ secrets.SSH_KEY }}' | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "❌ SSH_KEY does not contain a valid PEM header (-----BEGIN ... PRIVATE KEY-----)"
            exit 1
          fi
          if ! echo '${{ secrets.SSH_KEY }}' | grep -q "END.*PRIVATE KEY"; then
            echo "❌ SSH_KEY does not contain a valid PEM footer (-----END ... PRIVATE KEY-----)"
            exit 1
          fi
          echo "✅ SSH_KEY looks well-formed."

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}       # ⬅️ OBLIGATOIRE
          username: ${{ secrets.VPS_USER }}   # ⬅️ OBLIGATOIRE
          key: ${{ secrets.SSH_KEY }}     # ⬅️ OBLIGATOIRE (clé privée entière BEGIN/END)
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -e

            echo "==> Clone frais du repo"
            cd ~
            rm -rf award-voting
            git clone -b ${{ github.ref_name }} \
              https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} \
              award-voting
            cd award-voting

            echo "==> Debug structure (doit lister server/requirements.txt)"
            ls -la
            ls -la server || true
            ls -la client || true

            echo "==> Build images (contexte = racine du repo)"
            docker build -t award_voting_server:latest -f server/Dockerfile .
            docker build -t award_voting_client:latest -f client/Dockerfile .

            echo "==> Stop & remove containers (si existent)"
            docker stop award_voting_server || true
            docker rm   award_voting_server || true
            docker stop award_voting_client || true
            docker rm   award_voting_client || true

            echo "==> Crée le réseau si besoin"
            docker network create award_net || true

            echo "==> Run backend (FastAPI sur 8003)"
            docker run -d \
              --name award_voting_server \
              --network award_net \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              --restart=unless-stopped \
              award_voting_server:latest

            echo "==> Run frontend (Nginx sur 8080)"
            docker run -d \
              --name award_voting_client \
              --network award_net \
              -p 8080:80 \
              --restart=unless-stopped \
              award_voting_client:latest

            echo "==> Cleanup images"
            docker image prune -f || true
