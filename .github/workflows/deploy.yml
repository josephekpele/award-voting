name: Deploy Award Voting to VPS

on:
  push:
    branches: [ "develop" ]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "==> Clonage propre du dépôt"
            cd ~
            rm -rf award-voting
            git clone -b ${{ github.ref_name }} https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} award-voting
            cd award-voting

            echo "==> (Debug) Vérification de la structure"
            ls -la
            ls -la server || true
            ls -la client || true

            echo "==> Build des images Docker (contexte = racine du repo)"
            # IMPORTANT: contexte = ".", car les Dockerfile font COPY server/... et client/...
            docker build -t award_voting_server:latest -f server/Dockerfile .
            docker build -t award_voting_client:latest -f client/Dockerfile .

            echo "==> Arrêt et suppression des anciens conteneurs (si présents)"
            docker stop award_voting_server || true
            docker rm   award_voting_server || true
            docker stop award_voting_client || true
            docker rm   award_voting_client || true

            echo "==> Réseau Docker (si non existant)"
            docker network create award_net || true

            echo "==> Lancement du backend (FastAPI)"
            docker run -d \
              --name award_voting_server \
              --network award_net \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -p 8000:8000 \
              --restart=unless-stopped \
              award_voting_server:latest

            echo "==> Lancement du frontend (Nginx servant le build Vite)"
            docker run -d \
              --name award_voting_client \
              --network award_net \
              -p 8080:80 \
              --restart=unless-stopped \
              award_voting_client:latest

            echo "==> Nettoyage d'images inutilisées"
            docker image prune -f || true
